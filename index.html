<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090b10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Backyard Ultra</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body><div class="app-shell"><header class="topbar"><div><div class="race-kicker">RACE DAY • BACKYARD ULTRA</div><h1 id="raceTitle">Backyard Ultra</h1></div><button id="modeBtn" class="mode-toggle">RUNNER MODE</button></header><main class="content"><div id="error" class="error hidden"></div><section class="race-card"><div class="status-line"><span id="raceStatus" class="pill">NOT STARTED</span><span id="syncStatus">Connecting…</span></div><div class="loop-label">CURRENT LOOP</div><div id="currentLoop" class="loop-number">—</div><div class="timer-label">TIME TO NEXT START</div><div id="countdown" class="countdown">--:--:--</div><div class="stats"><div><span>MILES</span><strong id="miles">0.0</strong></div><div><span>ELAPSED</span><strong id="elapsed">—</strong></div><div><span>LAST LOOP</span><strong id="lastLoop">—</strong></div></div></section><section class="next-card"><div class="section-kicker">UP NEXT</div><div id="nextPlan" class="next-title">Loading…</div><div id="nextMeta" class="next-meta"></div></section><section id="crewPanel"><section class="card"><div class="section-title"><h2>Race control</h2><span id="lastUpdated">—</span></div><div class="control-grid"><button id="startBtn" class="action primary">START RACE</button><button id="completeBtn" class="action">✓ LOOP COMPLETE</button><button id="finishBtn" class="action">FINISH</button><button id="dnfBtn" class="action danger">DNF</button></div></section><section class="card"><div class="section-title"><h2>Race plan</h2><button id="addPlanBtn" class="add">+ ADD</button></div><div id="planList"></div></section><section class="card"><div class="section-title"><h2>Reminders</h2><button id="addReminderBtn" class="add">+ ADD</button></div><div id="reminderList"></div></section><section class="card"><div class="section-title"><h2>Loop history</h2></div><div id="loopList"></div></section></section><section class="card quick-note"><div class="section-title"><h2>Quick note</h2></div><div class="note-row"><input id="noteInput" placeholder="Something to remember…"><button id="saveNoteBtn">SAVE</button></div><div id="noteList"></div></section></main></div><dialog id="planDialog"><form method="dialog" id="planForm"><div class="dialog-head"><h2>Add to race plan</h2><button value="cancel" class="x">×</button></div><label>Name<input name="name" required></label><label>Time<input name="time" placeholder="e.g. 11:00 AM" required></label><label>Loop #<input name="loop" type="number"></label><label>Item<input name="item"></label><label>Category<input name="category" placeholder="Food, Supplement, Rest…"></label><label>Notes<textarea name="notes"></textarea></label><button class="full primary" value="default">ADD TO PLAN</button></form></dialog><dialog id="reminderDialog"><form method="dialog" id="reminderForm"><div class="dialog-head"><h2>Add reminder</h2><button value="cancel" class="x">×</button></div><label>Reminder<input name="reminder" required></label><label>Type<select name="type"><option>Every N loops</option><option>Every N hours</option><option>One-time</option></select></label><label>Interval<input name="interval" type="number"></label><label>Next Due<input name="nextDue" placeholder="e.g. 9 or 11:00 AM"></label><label>Notes<textarea name="notes"></textarea></label><button class="full primary" value="default">ADD REMINDER</button></form></dialog><script src="config.js"></script><script src="app.js"></script></body></html>
